name: Build K40 Bridge EXE

on:
  push:
    paths:
      - 'k40_bridge/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyzk requests pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name k40_bridge k40_bridge/k40_bridge.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: k40_bridge_exe
          path: dist/k40_bridge.exe
