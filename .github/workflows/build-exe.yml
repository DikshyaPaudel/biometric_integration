name: Build K40 Bridge EXE

on:
  push:
    paths:
      - 'k40_bridge/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r k40_bridge/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name k40_bridge k40_bridge/k40_bridge.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: k40_bridge
          path: dist/k40_bridge.exe
